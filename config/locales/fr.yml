      items:
        - question: "Qu’est-ce que Spylitic exactement ?"
          answer: "Spylitic est une plateforme d’intelligence publicitaire qui analyse les publicités publiques diffusées sur Facebook, Instagram et TikTok. Elle t’aide à comprendre pourquoi certaines publicités fonctionnent : CTA, angles marketing, structure du message, ton et durée de diffusion — expliqués par l’IA."
        - question: "Spylitic est-il un outil “Ad Spy” ?"
          answer: "Non. Spylitic ne se contente pas de lister des publicités. Il transforme les annonces publiques en insights compréhensibles et actionnables, pensés pour les fondateurs, agences et marketers."
        - question: "Quelles plateformes sont supportées ?"
          answer: "Actuellement : Facebook, Instagram et TikTok. D’autres plateformes (Google, Pinterest, YouTube Ads) sont prévues dans la roadmap."
        - question: "D’où proviennent les données analysées ?"
          answer: "Spylitic utilise uniquement des données publiques, issues de bibliothèques officielles et de sources accessibles légalement. Aucune donnée privée ou confidentielle n’est utilisée."
        - question: "Est-ce légal d’utiliser Spylitic ?"
          answer: "Oui. Spylitic respecte strictement les règles de Meta et TikTok : pas d’accès aux comptes Ads, pas de données personnelles, pas de scraping interdit."
        - question: "À qui s’adresse Spylitic ?"
          answer: "Spylitic est conçu pour : Fondateurs SaaS, Agences marketing, Growth marketers, Copywriters & media buyers, Marques e-commerce et mobile. Si tu veux comprendre avant de dépenser, Spylitic est pour toi."

  privacy:
    title: "Politique de confidentialité"
    last_updated: "Dernière mise à jour : 19 février 2026"
    introduction: "Chez Spylitic, we take your privacy seriously. Cette Politique de confidentialité explique comment nous collectons, utilisons, divulguons et protégeons vos informations lorsque vous visitez notre site web ou utilisez notre plateforme d'intelligence publicitaire. Veuillez lire attentivement cette politique pour comprendre notre approche en matière de protection de vos données personnelles."
    sections:
      - title: "1. Informations que nous collectons"
        content: "Nous collectons les informations que vous nous fournissez directement, notamment lorsque vous demandez un accès anticipé, créez un compte ou nous contactez. Cela peut inclure votre nom, adresse e-mail, nom de l'entreprise et toute autre information que vous choisissez de fournir. Nous collectons également automatiquement certaines informations lors de votre visite sur notre site, telles que votre adresse IP, le type de navigateur, les informations sur l'appareil, les pages visitées et les URL de référence. Nous utilisons des cookies et des technologies similaires pour collecter ces données et améliorer votre expérience."
      - title: "2. Comment nous utilisons les informations"
        content: "Nous utilisons les informations collectées pour fournir, maintenir et améliorer nos services ; traiter vos demandes d'accès anticipé et communiquer avec vous concernant votre compte ; vous envoyer des mises à jour produit, des communications marketing (lorsque vous avez opté pour les recevoir) et des messages de support ; analyser les tendances d'utilisation et optimiser notre plateforme ; détecter, prévenir et traiter les problèmes techniques et les menaces de sécurité ; et nous conformer à nos obligations légales. Nous ne vendons pas vos informations personnelles à des tiers."
      - title: "3. Sécurité des données"
        content: "Nous mettons en œuvre des mesures techniques et organisationnelles conformes aux normes du secteur pour protéger vos informations personnelles contre tout accès, modification, divulgation ou destruction non autorisés. Cela inclut le chiffrement en transit (TLS/SSL), le stockage sécurisé des données, les contrôles d'accès et des évaluations de sécurité régulières. Bien que nous nous efforcions de protéger vos données, aucune méthode de transmission sur Internet ou de stockage électronique n'est totalement sécurisée, et we cannot guarantee absolute security."
      - title: "4. Conservation des données"
        content: "Nous conservons vos informations personnelles uniquement pendant la durée nécessaire pour atteindre les objectifs pour lesquels elles ont été collectées, y compris pour satisfaire aux obligations légales, comptables ou de reporting. Lorsque vos données ne sont plus nécessaires, nous les supprimons ou les anonymisons de manière sécurisée. Vous pouvez demander la suppression de vos données à tout moment en nous contactant à privacy@spylitic.com."
      - title: "5. Vos droits"
        content: "Selon votre localisation, vous pouvez avoir le droit d'accéder, de corriger, de mettre à jour ou de supprimer vos informations personnelles ; de restreindre ou de vous opposer au traitement ; à la portabilité des données ; et de retirer votre consentement lorsque nous nous appuyons sur celui-ci. Si vous êtes dans l'Espace économique européen, vous avez également le droit de déposer une plainte auprès d'une autorité de contrôle. Pour exercer l'un de ces droits, veuillez nous contacter à privacy@spylitic.com. Nous répondrons à votre demande dans le délai requis par la loi applicable."
      - title: "6. Cookies et suivi"
        content: "Nous utilisons des cookies et des technologies de suivi similaires pour améliorer votre expérience de navigation, analyser le trafic du site et comprendre le comportement des utilisateurs. Les cookies sont de petits fichiers de données stockés sur votre appareil. Vous pouvez contrôler les cookies via les paramètres de votre navigateur ; toutefois, la désactivation de certains cookies peut affecter les fonctionnalités de notre site. Nous pouvons utiliser des prestataires d'analytics (tels que Google Analytics) qui collectent des informations pour nous aider à améliorer nos services."
      - title: "7. Services tiers"
        content: "Notre site web et notre plateforme peuvent contenir des liens vers des sites tiers ou intégrer des services tiers. Nous ne sommes pas responsables des pratiques de confidentialité de ces sites externes. Nous vous encourageons à lire leurs politiques de confidentialité avant de fournir des informations personnelles. Nous ne partageons vos données qu'avec des prestataires de services qui nous aident à exploiter notre activité (hébergement, analytics, envoi d'e-mails) et qui sont contractuellement tenus de protéger vos informations."
      - title: "8. Transferts internationaux"
        content: "Vos informations peuvent être transférées et traitées dans des pays autres que votre pays de résidence. Ces pays peuvent avoir des lois différentes en matière de protection des données. Lorsque nous transférons des données à l'international, nous prenons les mesures appropriées pour garantir que vos informations restent protégées conformément à cette Politique de confidentialité et à la loi applicable."
      - title: "9. Modifications de cette politique"
        content: "Nous pouvons mettre à jour cette Politique de confidentialité de temps à autre pour refléter les changements dans nos pratiques ou les exigences légales. Nous vous informerons de toute modification importante en publiant la politique mise à jour sur cette page et en mettant à jour la date « Dernière mise à jour ». Nous vous encourageons à consulter cette politique périodiquement pour obtenir les dernières informations sur nos pratiques en matière de confidentialité."

  data_deletion:
