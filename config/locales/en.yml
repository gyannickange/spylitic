          answer: "Spylitic uses only public data from official libraries and legally accessible sources. No private or confidential data is used."
        - question: "Is it legal to use Spylitic?"
          answer: "Yes. Spylitic strictly follows Meta and TikTok rules: no access to ad accounts, no personal data, no prohibited scraping."
        - question: "Who is Spylitic for?"
          answer: "Spylitic is built for SaaS founders, marketing agencies, growth marketers, copywriters and media buyers, and ecommerce or mobile brands. If you want to understand before you spend, Spylitic is for you."

  privacy:
    title: "Privacy Policy"
    last_updated: "Last updated: February 19, 2026"
    introduction: "At Spylitic, we take your privacy seriously. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website or use our advertising intelligence platform. Please read this policy carefully to understand our views and practices regarding your personal data."
    sections:
      - title: "1. Information We Collect"
        content: "We collect information that you provide directly to us, including when you request early access, create an account, or contact us. This may include your name, email address, company name, and any other information you choose to provide. We also automatically collect certain information when you visit our website, such as your IP address, browser type, device information, pages visited, and referring URLs. We use cookies and similar technologies to collect this data and improve your experience."
      - title: "2. How We Use Information"
        content: "We use the information we collect to provide, maintain, and improve our services; to process your early access requests and communicate with you about your account; to send you product updates, marketing communications (where you have opted in), and support messages; to analyze usage patterns and optimize our platform; to detect, prevent, and address technical issues and security threats; and to comply with legal obligations. We do not sell your personal information to third parties."
      - title: "3. Data Security"
        content: "We implement industry-standard technical and organizational measures to protect your personal information against unauthorized access, alteration, disclosure, or destruction. This includes encryption in transit (TLS/SSL), secure data storage, access controls, and regular security assessments. While we strive to protect your data, no method of transmission over the Internet or electronic storage is 100% secure, and we cannot guarantee absolute security."
      - title: "4. Data Retention"
        content: "We retain your personal information only for as long as necessary to fulfill the purposes for which it was collected, including to satisfy legal, accounting, or reporting requirements. When your data is no longer needed, we securely delete or anonymize it. You may request deletion of your data at any time by contacting us at privacy@spylitic.com."
      - title: "5. Your Rights"
        content: "Depending on your location, you may have the right to access, correct, update, or delete your personal information; to restrict or object to processing; to data portability; and to withdraw consent where we rely on it. If you are in the European Economic Area, you also have the right to lodge a complaint with a supervisory authority. To exercise any of these rights, please contact us at privacy@spylitic.com. We will respond to your request within the timeframe required by applicable law."
      - title: "6. Cookies and Tracking"
        content: "We use cookies and similar tracking technologies to enhance your browsing experience, analyze site traffic, and understand user behavior. Cookies are small data files stored on your device. You can control cookies through your browser settings; however, disabling certain cookies may affect the functionality of our website. We may use analytics providers (such as Google Analytics) that collect information to help us improve our services."
      - title: "7. Third-Party Services"
        content: "Our website and platform may contain links to third-party websites or integrate with third-party services. We are not responsible for the privacy practices of these external sites. We encourage you to read their privacy policies before providing any personal information. We only share your data with service providers who assist us in operating our business (e.g., hosting, analytics, email delivery) and who are contractually bound to protect your information."
      - title: "8. International Transfers"
        content: "Your information may be transferred to and processed in countries other than your country of residence. These countries may have different data protection laws. When we transfer data internationally, we take appropriate safeguards to ensure your information remains protected in accordance with this Privacy Policy and applicable law."
      - title: "9. Changes to This Policy"
        content: "We may update this Privacy Policy from time to time to reflect changes in our practices or legal requirements. We will notify you of any material changes by posting the updated policy on this page and updating the \"Last updated\" date. We encourage you to review this policy periodically for the latest information on our privacy practices."
