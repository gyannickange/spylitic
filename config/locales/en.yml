          answer: "Spylitic is an ad intelligence platform that analyzes public ads on Facebook, Instagram, and TikTok. It helps you understand why certain ads work: CTA, angles, message structure, tone, and run duration — explained by AI."
        - question: "Is Spylitic an “Ad Spy” tool?"
          answer: "No. Spylitic does not just list ads. It turns public ads into clear, actionable insights built for founders, agencies, and marketers."
